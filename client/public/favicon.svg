<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="128" fill="#0b111e"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Graduation Mortarboard & Book Emblem -->
  <!-- Top cap diamond -->
  <path d="M 256 120 L 416 190 L 256 260 L 96 190 Z" fill="url(#accentGrad)" filter="url(#glow)"/>
  
  <!-- Cap skull band -->
  <path d="M 160 225 L 160 290 C 160 330 352 330 352 290 L 352 225 L 256 268 Z" fill="#ffffff" opacity="0.95"/>
  
  <!-- Tassel -->
  <path d="M 380 205 L 396 295 C 396 315 416 315 416 295 L 400 205 Z" fill="#fbbf24"/>
  
  <!-- Lower Open Book / Accounting Ledger Base -->
  <path d="M 112 340 C 180 320 240 335 256 365 C 272 335 332 320 400 340 L 400 410 C 332 390 272 405 256 435 C 240 405 180 390 112 410 Z" fill="#ffffff" opacity="0.95"/>
  <line x1="256" y1="365" x2="256" y2="435" stroke="#4f46e5" stroke-width="6"/>

  <!-- Currency Sparkle / Check mark -->
  <circle cx="390" cy="140" r="24" fill="#10b981"/>
  <path d="M 380 140 L 387 147 L 402 132" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
